/* Layout: eine ruhige Spalte (max 720px) mit vier Tabs: Heute, Training, Fokus, Ich */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --ink:#11201D; --muted:#5B6B67; --line:#D8E1DE; --sunk:#E9EFED;
  --acc:#0F766E; --soft:#D6EEEA; --on-acc:#FFFFFF; --warn:#B7791F; --bad:#C2372C; --good:#15803D;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1312; --surface:#141D1B; --ink:#E8F1EE; --muted:#93A6A1; --line:#25322F; --sunk:#1A2523;
  --acc:#2DD4BF; --soft:#12302C; --on-acc:#06201C; --warn:#F2B84B; --bad:#FF7468; --good:#4ADE80; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0C1312; --surface:#141D1B; --ink:#E8F1EE; --muted:#93A6A1; --line:#25322F; --sunk:#1A2523;
  --acc:#2DD4BF; --soft:#12302C; --on-acc:#06201C; --warn:#F2B84B; --bad:#FF7468; --good:#4ADE80; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px calc(100px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:26px}
.d{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:.92;margin:0;text-wrap:balance}
.eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:.86rem}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:14px}
.mark{font-family:var(--display);font-weight:900;font-size:1.9rem;text-transform:uppercase;letter-spacing:.02em;line-height:1}
.mark i{font-style:normal;color:var(--acc)}
.av{width:38px;height:38px;border-radius:50%;background:var(--acc);color:var(--on-acc);display:inline-flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:900;font-size:1.25rem;flex:none;border:0;cursor:pointer}
.hello{font-size:clamp(2.4rem,9vw,3.4rem)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.seg{display:flex;flex-wrap:wrap;background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.seg label{flex:1;cursor:pointer;position:relative;min-width:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;border-radius:9px;padding:10px 4px;font-weight:600;font-size:.9rem;color:var(--muted);min-height:44px;overflow-wrap:anywhere}
.seg input:checked+span{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line)}
.seg input:focus-visible+span{outline:3px solid var(--acc);outline-offset:2px}
.seg.multi input:checked+span{background:var(--acc);color:var(--on-acc);box-shadow:none}
.facts{display:flex;gap:18px 22px;flex-wrap:wrap}
.facts div{display:flex;flex-direction:column}
.facts b{font-family:var(--display);font-size:2rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.facts span{font-size:.78rem;color:var(--muted);font-weight:600}
.go{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--acc);color:var(--on-acc);border:0;border-radius:14px;padding:12px 22px;font-weight:700;font-size:1.05rem;cursor:pointer;min-height:50px}
.go:hover{filter:brightness(1.06)}
.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 16px;font-weight:600;cursor:pointer;min-height:44px}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.sm{min-height:38px;padding:5px 12px;font-size:.88rem}
.btn.on{background:var(--soft);color:var(--acc);border-color:var(--acc)}
.section-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.section-h h2{font-size:1.9rem}
.pill{font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.acc{background:var(--soft);color:var(--acc)}
.pill.bad{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.card.alert{border-color:var(--bad);border-width:2px}
.card.hint{border-color:var(--acc);border-width:2px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:.84rem;font-weight:600;color:var(--muted);min-width:0}
input[type=text],input[type=number],input[type=time],input[type=date],select{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-height:46px}
input:focus,select:focus{outline:2px solid var(--acc);outline-offset:-1px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.err{color:var(--bad);font-weight:600;font-size:.9rem}
footer{font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs nav{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{background:none;border:0;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.74rem;font-weight:700;color:var(--muted);cursor:pointer;letter-spacing:.04em;text-transform:uppercase}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--acc)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:.9rem;z-index:95;max-width:calc(100% - 32px);text-align:center}
.install{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;background:var(--soft);font-size:.9rem}
.install b{display:block}
.close{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:1.3rem;line-height:1;flex:none}
.chk{display:flex;gap:10px;align-items:center;font-weight:600}
.chk input{width:22px;height:22px;accent-color:var(--acc);flex:none}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.74rem;font-weight:700;color:var(--muted)}
.wd i{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-style:normal;color:var(--on-acc);font-size:.9rem}
.wd.plan i{border-color:var(--acc)}
.wd.done i{background:var(--acc);border-color:var(--acc)}
.wd.now span{color:var(--acc);font-weight:800}
.wd.now i{border-width:3px}
.tl{display:flex;flex-direction:column}
.tlr{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.tlr.mini{padding:7px 0;font-size:.9rem;color:var(--muted)}
.tlr .tt{font-family:var(--display);font-weight:800;font-size:1.3rem;font-variant-numeric:tabular-nums;color:var(--muted);line-height:1.15}
.tlr.mini .tt{font-size:1.05rem}
.tlr.now .tt{color:var(--acc)}
.tlr.now{box-shadow:inset 3px 0 0 var(--acc);padding-left:8px}
.tlr.past{opacity:.55}
.tlb{display:flex;flex-direction:column;gap:6px;min-width:0}
.tla{display:flex;gap:8px;flex-wrap:wrap}
.acc{color:var(--acc);font-weight:700}
details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
details.card{display:block;padding:16px 18px}
details.card>summary{display:flex;justify-content:space-between;align-items:center;gap:10px}
details.card>*+*{margin-top:12px}
.ing{margin:6px 0 0;padding-left:18px;font-size:.9rem;color:var(--muted)}
.tips{margin:0;padding-left:18px;font-size:.92rem}
.tips li{margin:2px 0}
.glasses{display:flex;flex-wrap:wrap;gap:5px}
.glasses i{width:18px;height:24px;border:2px solid var(--acc);border-radius:3px 3px 7px 7px}
.glasses i.on{background:var(--acc)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.focus{gap:8px;padding:14px}
.ftable{width:100%;border-collapse:collapse;font-size:.88rem}
.ftable td{padding:8px 4px;border-top:1px solid var(--line);vertical-align:top}
.ftable td.hit{font-weight:600}
.ftable td:first-child{width:42%}
.ex{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 0;border-top:1px solid var(--line)}
.ex b{display:block}
.ex .rep{font-family:var(--display);font-weight:800;font-size:1.2rem;color:var(--acc);text-align:right;white-space:nowrap}
.ex p{grid-column:1/-1;margin:0;font-size:.86rem;color:var(--muted)}
.loading{padding:80px 0;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<body>
<div id="app"><div class="wrap"><div class="loading">Vital lädt …</div></div></div>
<div id="toast"></div>
<script>
window.onerror=function(m,src,l){try{var b=document.getElementById('err-box');if(!b){b=document.createElement('div');b.id='err-box';b.style.cssText='position:fixed;left:12px;right:12px;bottom:12px;z-index:999;background:#C2372C;color:#fff;padding:12px 14px;border-radius:12px;font:14px/1.4 -apple-system,sans-serif';document.body.appendChild(b)}b.textContent='Fehler: '+m+' (Zeile '+l+'). Bitte Screenshot an Claude schicken.'}catch(e){}};

/* =================== Hilfsfunktionen =================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('de-DE');
const num=v=>{const x=parseFloat(String(v==null?'':v).replace(',','.'));return Number.isFinite(x)?x:NaN};
const clone=o=>JSON.parse(JSON.stringify(o));
const z=n=>String(n).padStart(2,'0');
const keyOf=(d=new Date())=>d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());
const parseKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const d=parseKey(k);d.setDate(d.getDate()+n);return keyOf(d)};
const wday=k=>(parseKey(k).getDay()+6)%7;
const WD=['Mo','Di','Mi','Do','Fr','Sa','So'];
const longDate=k=>parseKey(k).toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});
const shortDate=k=>{const d=parseKey(k);return z(d.getDate())+'.'+z(d.getMonth()+1)+'.'+d.getFullYear()};
const weekIndex=k=>{const d=parseKey(k);d.setDate(d.getDate()-wday(k));return Math.round((d-new Date(2024,0,1))/6048e5)};
const today=()=>keyOf();
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
const tm=s=>{const [a,b]=String(s||'0:0').split(':').map(Number);return (a||0)*60+(b||0)};
const hm=m=>{m=Math.round(m);return z(Math.floor(m/60)%24)+':'+z(m%60)};
const fmtL=ml=>(ml/1000).toLocaleString('de-DE',{maximumFractionDigits:2})+' l';
const seg=(name,val,opts)=>`<div class="seg">${opts.map(([v,l])=>`<label><input type="radio" name="${name}" value="${v}" ${String(val)===String(v)?'checked':''}><span>${l}</span></label>`).join('')}</div>`;
let toastT;function toast(m){$('#toast').innerHTML=`<div class="toast" role="status">${esc(m)}</div>`;clearTimeout(toastT);toastT=setTimeout(()=>$('#toast').innerHTML='',3500)}

/* =================== Speicher (nur auf diesem Gerät) =================== */
// Die Gen-Datei selbst wird nie gespeichert, nur die ausgewerteten Marker.
const LS='vital.v1';
let V={};try{V=JSON.parse(localStorage.getItem(LS)||'{}')||{}}catch(e){V={}}
function save(){const ks=Object.keys(V.days||{}).sort();while(ks.length>90)delete V.days[ks.shift()];try{localStorage.setItem(LS,JSON.stringify(V))}catch(e){toast('Speicher voll. Bitte eine Sicherung herunterladen.')}}
const UI={tab:'heute',edit:false};
const REM0={on:false,wake:'07:00',sleep:'22:30',every:2,train:'18:00'};
const rem=()=>({...REM0,...(V.rem||{})});
const P=()=>V.profile;
const day=k=>(V.days&&V.days[k])||{w:0,m:{},sw:{},tr:false};
function setDay(k,fn){V.days=V.days||{};const d=clone(day(k));fn(d);V.days[k]=d;save()}

/* =================== Training =================== */
const WO={
 kraftA:{n:'Kraft A · Ganzkörper',min:35,d:'Kraft für Beine, Brust, Rücken und Rumpf',ex:[['Kniebeugen','3 × 12','Füße schulterbreit, Po nach hinten, Rücken gerade.'],['Liegestütze','3 × 8–12','Leichter: Hände auf einen Tisch oder Knie am Boden.'],['Ausfallschritte','3 × 10 je Bein','Hinteres Knie fast bis zum Boden.'],['Rudern mit Rucksack','3 × 12','Rucksack mit Büchern, Oberkörper vorgebeugt, Ellbogen nach hinten ziehen.'],['Unterarmstütz','3 × 30–45 s','Körper gerade wie ein Brett.'],['Po-Brücke','3 × 15','Rückenlage, Becken hoch, oben 2 Sekunden halten.']]},
 kraftB:{n:'Kraft B · Ganzkörper',min:35,d:'Kraft für Beine, Schultern, Rücken und Rumpf',ex:[['Bulgarische Kniebeuge','3 × 8 je Bein','Hinterer Fuß auf Stuhl oder Sofa.'],['Schulterdrücken mit Wasserflaschen','3 × 12','Zwei volle 1,5-l-Flaschen über den Kopf drücken.'],['Hüftbeuge mit Rucksack','3 × 12','Rucksack vor der Brust, Hüfte nach hinten schieben, Rücken gerade.'],['Superman','3 × 12','Bauchlage, Arme und Beine kurz anheben.'],['Seitstütz','3 × 25 s je Seite','Hüfte oben halten.'],['Wadenheben','3 × 20','Auf einer Stufe, langsam absenken.']]},
 ausdauer:{n:'Ausdauer locker',min:40,d:'Herz, Fettstoffwechsel und Blutzucker',ex:[['Zügiges Gehen, Rad oder lockeres Joggen','30–45 min','So schnell, dass du noch in ganzen Sätzen sprechen kannst.'],['Dehnen','5 min','Waden, Oberschenkel, Hüfte.']]},
 intervall:{n:'Intervalle',min:30,d:'Kondition und Herz in kurzer Zeit',ex:[['Einlaufen','10 min','Locker gehen oder joggen.'],['Intervalle','6 × 1 min','Jede Minute zügig (Sprechen fällt schwer), danach 2 Minuten locker.'],['Auslaufen','5 min','Locker, danach dehnen.']]},
 mobil:{n:'Beweglichkeit & Rücken',min:20,d:'Gelenke, Rücken und Erholung',ex:[['Katze-Kuh','10 ×','Im Vierfüßlerstand Rücken rund und hohl machen.'],['Hüftbeuger-Dehnung','2 × 30 s je Seite','Ausfallschritt, Becken nach vorne schieben.'],['Brustwirbel-Rotation','10 × je Seite','Seitlage, oberen Arm nach hinten aufdrehen.'],['Tiefe Hocke halten','3 × 30 s','Fersen am Boden, an einer Tür festhalten.'],['Vorbeuge','2 × 30 s','Knie leicht gebeugt, locker hängen lassen.']]},
};
const SEQ={ab:['kraftA','ausdauer','kraftB','intervall','ausdauer','mobil','ausdauer'],halten:['kraftA','ausdauer','kraftB','mobil','intervall','ausdauer','mobil'],aufbau:['kraftA','kraftB','ausdauer','kraftA','kraftB','mobil','ausdauer'],leistung:['intervall','kraftA','ausdauer','kraftB','intervall','mobil','ausdauer']};
function woFor(k){const p=P();if(!p)return null;const td=(p.tdays||[]).slice().sort((a,b)=>a-b),i=td.indexOf(wday(k));if(i<0)return null;
 let id=(SEQ[p.goal]||SEQ.halten)[i%7];if(weekIndex(k)%2){if(id==='kraftA')id='kraftB';else if(id==='kraftB')id='kraftA'}return id}

/* =================== Gene, Blutwerte, Fokus =================== */
const GENES=[
 {rs:'rs9939609',g:'FTO',a:'A',f:'appetit',t:['Eine Kopie der Appetit-Variante: etwas weniger Sättigung.','Zwei Kopien der Appetit-Variante: schneller Hunger, weniger Sättigung.']},
 {rs:'rs738409',g:'PNPLA3',a:'G',f:'leber',t:['Eine Kopie: die Leber lagert etwas leichter Fett ein.','Zwei Kopien: die Leber lagert deutlich leichter Fett ein.']},
 {rs:'rs7903146',g:'TCF7L2',a:'T',f:'zucker',t:['Eine Kopie: der Blutzucker reagiert etwas empfindlicher.','Zwei Kopien: der Blutzucker reagiert deutlich empfindlicher.']},
 {rs:'rs1333049',g:'9p21 (Herz)',a:'C',f:'herz',t:['Eine Kopie der häufigen Herz-Risikoregion.','Zwei Kopien der häufigen Herz-Risikoregion.']},
 {rs:'rs429358',g:'APOE ε4',a:'C',f:'fett',t:['Eine Kopie APOE ε4: Cholesterin reagiert stärker auf gesättigte Fette. Bitte ärztlich besprechen.','Zwei Kopien APOE ε4: Cholesterin reagiert stark auf gesättigte Fette. Bitte ärztlich besprechen.']},
 {rs:'rs699',g:'AGT',a:'G',min:2,f:'salz',t:['','Zwei Kopien: der Blutdruck reagiert stärker auf Salz.']},
 {rs:'rs4988235',g:'LCT (Laktase)',eq:'GG',f:'laktose',t1:'Laktase wird im Erwachsenenalter wahrscheinlich abgeschaltet.'},
 {rs:'rs1801133',g:'MTHFR',a:'A',f:'folat',t:['Eine Kopie: Folat wird etwas langsamer verarbeitet (häufig).','Zwei Kopien: Folat wird deutlich langsamer verarbeitet.']},
 {rs:'rs12934922',g:'BCMO1',a:'T',f:'vita',t:['Eine Kopie: Beta-Carotin wird etwas schlechter zu Vitamin A.','Zwei Kopien: Beta-Carotin wird schlechter zu Vitamin A.']},

async function inflate(u,fmt){if(typeof DecompressionStream==='undefined')throw new Error('nozip');return new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream(fmt))).arrayBuffer())}
async function unzip(u){
 const dv=new DataView(u.buffer,u.byteOffset,u.byteLength);let eo=-1;
 for(let i=u.length-22;i>=Math.max(0,u.length-65558);i--){if(dv.getUint32(i,true)===0x06054b50){eo=i;break}}if(eo<0)throw new Error('zip');
 const cnt=dv.getUint16(eo+10,true),td=new TextDecoder();let o=dv.getUint32(eo+16,true),best=null;
 for(let k=0;k<cnt;k++){if(dv.getUint32(o,true)!==0x02014b50)break;
  const meth=dv.getUint16(o+10,true),cs=dv.getUint32(o+20,true),us=dv.getUint32(o+24,true),nl=dv.getUint16(o+28,true),el=dv.getUint16(o+30,true),cl=dv.getUint16(o+32,true),lo=dv.getUint32(o+42,true),name=td.decode(u.subarray(o+46,o+46+nl));
  if(!name.endsWith('/')&&!name.includes('__MACOSX')){const sc=(/\.(txt|csv|tsv)$/i.test(name)?1e12:0)+us;if(!best||sc>best.sc)best={meth,cs,lo,sc}}o+=46+nl+el+cl}
 if(!best)throw new Error('zip');const st=best.lo+30+dv.getUint16(best.lo+26,true)+dv.getUint16(best.lo+28,true),data=u.subarray(st,st+best.cs);
 if(best.meth===0)return data;if(best.meth===8)return inflate(data,'deflate-raw');throw new Error('zip');
}
function parseGenes(txt){
 const want=new Set(GENES.map(g=>g.rs)),gt={},L=txt.length;let n=0,i=0;
 while(i<L){let j=txt.indexOf('\n',i);if(j<0)j=L;let s=i;if(txt.charCodeAt(s)===34)s++;
  if(txt.charCodeAt(s)===114&&txt.charCodeAt(s+1)===115){n++;let e=s;while(e<j){const c=txt.charCodeAt(e);if(c===9||c===44||c===34||c===32||c===13)break;e++}
   const id=txt.slice(s,e);if(want.has(id)){const cols=txt.slice(i,j).split(/[\t,]+| +/).map(x=>x.replace(/["\r]/g,'').trim()).filter(Boolean);
    let g=(cols.length>=5?cols[3]+cols[4]:cols[3]||'').toUpperCase();if(/^[ACGT]{1,2}$/.test(g)){if(g.length===1)g+=g;gt[id]=g}}}
  i=j+1}
 return{gt,n,found:Object.keys(gt).length};
}
async function readGene(file){
 const st=$('#gene-st'),show=m=>{if(st)st.textContent=m};show('Datei wird gelesen …');
 try{let u=new Uint8Array(await file.arrayBuffer());
  if(u[0]===0x50&&u[1]===0x4b)u=await unzip(u);else if(u[0]===0x1f&&u[1]===0x8b)u=await inflate(u,'gzip');
  const r=parseGenes(new TextDecoder().decode(u));
  if(!r.found){show('');toast('In der Datei wurden keine bekannten Gen-Marker gefunden.');return}
  V.genes={gt:r.gt,n:r.n,found:r.found,name:file.name.slice(0,60),date:today()};save();render(true);toast(r.found+' Gen-Marker ausgewertet. Dein Plan ist angepasst.')}
 catch(err){show('');toast(err&&err.message==='nozip'?'Dieses Gerät kann ZIP nicht entpacken. Bitte die entpackte .txt-Datei wählen.':'Die Datei konnte nicht gelesen werden.')}
}

 const p=P(),g=V.genes,bl=V.blood,bv=bl&&bl.v||{},r=rem(),perm=('Notification' in window)?Notification.permission:'na',n=nutrition(today());
 return `<div><span class="eyebrow">${p.age} Jahre · ${p.h} cm · ${String(p.w).replace('.',',')} kg${n?' · BMI '+n.bmi.toFixed(1).replace('.',','):''}</span><h1 class="d hello">${esc(p.name)}</h1></div>
  <section class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><b>Körper, Ziel &amp; Trainingstage</b><div class="small muted">${esc(GOALS.find(x=>x[0]===p.goal)[1])} · Training: ${(p.tdays||[]).slice().sort((a,b)=>a-b).map(i=>WD[i]).join(', ')||'keins'}${n?' · Grundumsatz '+fmt(n.bmr)+' kcal':''}</div></div><button class="btn" data-act="edit">Ändern</button></div></section>
  <details class="card" id="sec-gene" ${!g?'open':''}><summary><b>Gen-Datei</b><span class="pill ${g?'acc':''}">${g?g.found+' Marker':'fehlt'}</span></summary>
   <div class="small muted">Rohdaten von 23andMe, AncestryDNA, MyHeritage, FTDNA oder YSEQ (.txt, .csv, .zip). Die Datei wird nur auf diesem Gerät gelesen. Gespeichert werden nur die ${GENES.length} ausgewerteten Marker, nicht die ganze Datei.</div>
   ${g?`<div class="small">Geladen: <b>${esc(g.name)}</b> am ${esc(shortDate(g.date))} · ${fmt(g.n)} Marker gelesen · ${g.found} ausgewertet</div>`:''}
   <div style="display:flex;gap:8px;flex-wrap:wrap"><label class="btn" for="gene">${g?'Neue Datei laden':'Gen-Datei hochladen'}<input id="gene" type="file" accept=".txt,.csv,.tsv,.zip,.gz,text/plain,text/csv,application/zip" hidden></label>${g?'<button class="btn danger" data-act="delGenes">Löschen</button>':''}</div><div id="gene-st" class="small muted" role="status"></div></details>
  <details class="card" id="sec-blood" ${UI.blood||(g&&!bl)?'open':''}><summary><b>Blutwerte</b><span class="pill ${bl?'acc':''}">${bl?'vom '+esc(shortDate(bl.date)):'fehlen'}</span></summary>
   <form id="hbl" style="display:flex;flex-direction:column;gap:12px"><div class="small muted">Trage ein, was auf deinem Laborzettel steht. Leere Felder sind kein Problem. Vitamin D in nmol/l durch 2,5 teilen.</div>
    <label class="f" for="hbl-date">Datum der Blutabnahme<input id="hbl-date" type="date" value="${bl?bl.date:''}"></label>
    <div class="grid2">${BLOOD.map(([k,l,u])=>`<label class="f" for="hbl-${k}">${esc(l)} (${u})<input id="hbl-${k}" type="text" inputmode="decimal" value="${Number.isFinite(bv[k])?String(bv[k]).replace('.',','):''}"></label>`).join('')}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="go" style="flex:1" type="submit">Blutwerte speichern</button>${bl?'<button class="btn danger" type="button" data-act="delBlood">Löschen</button>':''}</div></form></details>
  <section class="card"><h2 class="d" style="font-size:1.6rem">Erinnerungen</h2>
   <form id="hr" style="display:flex;flex-direction:column;gap:12px">
    <label class="chk"><input id="hr-on" type="checkbox" ${r.on?'checked':''}> Erinnerungen an Trinken, Essen und Training</label>
    <div class="grid2"><label class="f" for="hr-wake">Aufstehen<input id="hr-wake" type="time" value="${r.wake}"></label><label class="f" for="hr-sleep">Schlafen<input id="hr-sleep" type="time" value="${r.sleep}"></label>
    <label class="f" for="hr-train">Training um<input id="hr-train" type="time" value="${r.train}"></label><label class="f" for="hr-every">Trinken alle<select id="hr-every">${[[1,'1 Stunde'],[1.5,'1,5 Stunden'],[2,'2 Stunden'],[3,'3 Stunden']].map(([v,l])=>`<option value="${v}" ${Number(r.every)===v?'selected':''}>${l}</option>`).join('')}</select></label></div>
    <button class="go" type="submit">Speichern</button></form>
   <div style="display:flex;gap:8px;flex-wrap:wrap">${perm==='default'||perm==='denied'?`<button class="btn" data-act="notif">Mitteilungen erlauben</button>`:''}<button class="btn" data-act="ics">In Kalender übernehmen</button></div>
   <div class="small muted">Mitteilungen kommen, solange Vital geöffnet ist${perm==='denied'?' (im Moment in den Einstellungen blockiert)':''}. Damit du auch bei geschlossener App erinnert wirst: „In Kalender übernehmen“ tippen. Der Kalender erinnert dann jeden Tag. Nach einer Änderung der Uhrzeiten die alten Termine im Kalender löschen und neu übernehmen.</div></section>
  <section class="card"><h2 class="d" style="font-size:1.6rem">Sicherung</h2><div class="small muted">Alle Daten liegen nur auf diesem Gerät. Mit einer Sicherung nimmst du sie auf ein neues Handy mit.</div>
   <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="export">Sicherung herunterladen</button><label class="btn" for="imp">Sicherung laden<input id="imp" type="file" accept="application/json,.json" hidden></label><button class="btn danger" data-act="wipe">Alles löschen</button></div></section>`;
}

/* =================== Aktionen =================== */
const ACT={
 tab:el=>{UI.tab=el.dataset.t;UI.blood=false;render(true);window.scrollTo(0,0)},
 edit:()=>{UI.edit=true;render(true);window.scrollTo(0,0)},
 cancelEdit:()=>{UI.edit=false;render(true)},
 water:el=>{const v=Number(el.dataset.v);setDay(today(),d=>{d.w=Math.max(0,Math.min(24,(d.w||0)+v))});render(true)},
 eat:el=>{const s=el.dataset.s;setDay(today(),d=>{d.m=d.m||{};d.m[s]=!d.m[s]});render(true)},
 swap:el=>{const s=el.dataset.s;setDay(today(),d=>{d.sw=d.sw||{};d.sw[s]=(d.sw[s]||0)+1;if(d.m)d.m[s]=false});render(true)},
 trDone:()=>{let on;setDay(today(),d=>{d.tr=!d.tr;on=d.tr});render(true);if(on)toast('Stark! Training erledigt.')},
 toBlood:()=>{UI.tab='ich';UI.blood=true;render(true);const e=$('#sec-blood');if(e)e.scrollIntoView()},
 skipGene:()=>{try{localStorage.setItem('vital.skip','1')}catch(e){}render(true);toast('Du findest den Upload jederzeit unter „Ich“.')},
 skipBlood:()=>{try{localStorage.setItem('vital.skip','1')}catch(e){}render(true);toast('Du findest die Blutwerte jederzeit unter „Ich“.')},
 delGenes:()=>{delete V.genes;save();render(true);toast('Gen-Daten gelöscht')},
 delBlood:()=>{delete V.blood;save();render(true);toast('Blutwerte gelöscht')},
 notif:async()=>{if(!('Notification' in window)){toast('Mitteilungen gehen hier nicht. Auf dem iPhone: Vital erst zum Home-Bildschirm hinzufügen. Oder den Kalender nutzen.');return}
   if(Notification.permission==='denied'){toast('Mitteilungen sind blockiert. Bitte in den Einstellungen erlauben.');return}
   const r=await Notification.requestPermission();if(r==='granted')notify('Erinnerungen an','So sehen deine Erinnerungen aus.');else toast('Mitteilungen wurden nicht erlaubt.');render(true)},
 ics:async()=>{if(await shareFile(icsFor(),'vital-erinnerungen.ics','text/calendar','Vital-Erinnerungen'))toast('Kalenderdatei erstellt. Öffnen und „Alle hinzufügen“ tippen.')},
 export:async()=>{const data=JSON.stringify({app:'vital',version:1,exported:new Date().toISOString(),data:V},null,1);if(await shareFile(data,'vital-sicherung-'+today()+'.json','application/json','Vital-Sicherung'))toast('Sicherung erstellt')},
 wipe:()=>{if(!confirm('Wirklich alle Daten auf diesem Gerät löschen?'))return;V={};save();UI.tab='heute';render(true)},
 hideInstall:()=>{try{localStorage.setItem('vital.hideInstall','1')}catch(e){}render(true)},
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=ACT[el.dataset.act];if(!f)return;e.preventDefault();f(el,e)});
document.addEventListener('submit',e=>{e.preventDefault();const id=e.target.id;
 if(id==='pf'){const gv=n=>{const r=document.querySelector(`input[name="${n}"]:checked`);return r?r.value:null},er=$('#pf-e');
  const name=$('#pf-n').value.trim().slice(0,20),age=Math.round(num($('#pf-a').value)),h=num($('#pf-h').value),w=num($('#pf-w').value);
  const bad=m=>{er.textContent=m;er.hidden=false};
  if(!name)return bad('Bitte gib deinen Vornamen ein.');if(!(age>=18&&age<=99))return bad('Vital ist für Erwachsene ab 18 Jahren.');
  if(!(h>=120&&h<=230)||!(w>=30&&w<=300))return bad('Bitte Größe (120–230 cm) und Gewicht (30–300 kg) eingeben.');
  const tdays=[...document.querySelectorAll('input[name="pf-t"]:checked')].map(x=>Number(x.value));
  const isNew=!P();V.profile={name,age,h:Math.round(h),w:Math.round(w*10)/10,sex:gv('pf-s')||'m',act:Number(gv('pf-act')||2),goal:gv('pf-g')||'halten',diet:gv('pf-d')||'alles',tdays};
  save();UI.edit=false;UI.tab='heute';render(true);window.scrollTo(0,0);toast(isNew?'Willkommen, '+name+'! Dein Plan ist fertig.':'Gespeichert. Dein Plan ist neu berechnet.');return}
 if(id==='hbl'){const v={};BLOOD.forEach(([k])=>{const x=num($('#hbl-'+k).value);if(Number.isFinite(x)&&x>0)v[k]=x});
  if(!Object.keys(v).length){toast('Bitte mindestens einen Wert eintragen.');return}
  V.blood={date:$('#hbl-date').value||today(),v};save();UI.blood=false;UI.tab='fokus';render(true);window.scrollTo(0,0);toast('Blutwerte gespeichert. Dein Plan ist angepasst.');return}
 if(id==='hr'){const on=$('#hr-on').checked;V.rem={...rem(),on,wake:$('#hr-wake').value||'07:00',sleep:$('#hr-sleep').value||'22:30',train:$('#hr-train').value||'18:00',every:Number($('#hr-every').value)||2};save();
  if(on&&'Notification' in window&&Notification.permission==='default')Notification.requestPermission().then(()=>render(true));
  render(true);toast(on?'Erinnerungen sind an':'Erinnerungen sind aus')}
});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='gene'){const f=t.files&&t.files[0];if(f)readGene(f);t.value='';return}
 if(t.id==='imp'){const f=t.files&&t.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const o=JSON.parse(rd.result);if(o.app!=='vital'||!o.data||!o.data.profile)throw 0;V=o.data;save();UI.tab='heute';render(true);toast('Sicherung geladen')}catch(x){toast('Das ist keine gültige Vital-Sicherung.')}};rd.readAsText(f);t.value=''}});
render(true);setTimeout(remCheck,2000);
if('serviceWorker' in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').then(r=>{setInterval(()=>r.update().catch(()=>{}),60*60*1000)}).catch(()=>{})})}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script>
</body>
</html>
